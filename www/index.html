<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>بالن غروب</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--card:#120e1cee;--ln:#ffffff1f;--gr:#2eb84f;--or:#ffa24a}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}html,body{height:100%;margin:0;background:#2a1748;overflow:hidden;font-family:Vazirmatn,Tahoma,sans-serif;color:#fff;touch-action:none}canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}.scr{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px}.scr.on{display:flex}h1{font-size:64px;margin:0;color:#ffb055;font-weight:800;text-shadow:0 4px 0 #b3410f,0 8px 18px #0006}h2{margin:0 0 6px;font-size:28px}.card{width:min(340px,100%);background:var(--card);border:1px solid var(--ln);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:10px;text-align:center}button,.row{font:inherit;color:#fff;border:1px solid var(--ln);background:#3b2a33;border-radius:999px;height:54px;padding:0 22px;display:flex;align-items:center;gap:14px;font-size:18px;font-weight:800;cursor:pointer}button.g{background:var(--gr);border-color:#5fe07f}button.d{background:#25232f}.menu{width:min(330px,88%)}.menu button{width:100%}.row{background:#1e1b29;border-radius:16px;justify-content:space-between;height:52px;font-size:16px}.tg{width:52px;height:30px;border-radius:99px;background:#555;position:relative;cursor:pointer}.tg:after{content:"";position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.15s}.tg.on{background:var(--gr)}.tg.on:after{right:25px}#hud{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));inset-inline:16px;display:none;justify-content:space-between;align-items:flex-start;pointer-events:none}#hud.on{display:flex}#sc{font-size:56px;font-weight:800;text-shadow:0 3px 10px #0008;line-height:1}#pz{pointer-events:auto;width:46px;height:46px;padding:0;justify-content:center;border-radius:14px;background:#ffffff33;font-size:20px}p{margin:0;line-height:1.9;font-size:15px;color:#e8dfff}.big{font-size:54px;font-weight:800;line-height:1}
</style></head><body><canvas id="c"></canvas><div id="hud"><div id="sc">0</div><button id="pz">❚❚</button></div>
<div class="scr on" id="menu"><h1>بالن غروب</h1><canvas id="m1" width="180" height="200"></canvas><div class="menu" style="display:flex;flex-direction:column;gap:12px"><button class="d" id="bPlay"><span style="color:#3fdc66">▶</span> بازی</button><button id="bSet">⚙ تنظیمات</button><button id="bGuide">📖 راهنما</button></div></div>
<div class="scr" id="set"><div class="card"><h2>تنظیمات</h2><div class="row">موسیقی<div class="tg on" id="tMus"></div></div><div class="row">صدای بازی<div class="tg on" id="tSfx"></div></div><div class="row">ویبره<div class="tg" id="tVib"></div></div><button class="d" id="bReset">★ بازنشانی امتیاز <span id="best"></span></button><button class="d" data-back>‹ بازگشت</button></div></div>
<div class="scr" id="guide"><div class="card"><h2>راهنما</h2><p>بالن خودکار حرکت می‌کند و تو ستون‌ها را جابه‌جا می‌کنی.</p><p>روی صفحه بزن و نگه دار، یا اسکرول کن تا دهانه ستون بالا برود؛ رها کنی پایین می‌آید.</p><p>دهانه را جلوی بالن نگه دار و از ستون‌ها رد شو.</p><button class="g" data-back>فهمیدم</button></div></div>
<div class="scr" id="pause"><div class="card"><h2>مکث شد</h2><button class="g" id="bRes">▶ ادامه</button><button class="d" id="bRe">↻ از ابتدا</button><button class="d" id="bHome1">⌂ منو</button></div></div>
<div class="scr" id="over"><div class="card"><h2>بازی تمام شد</h2><canvas id="m2" width="220" height="150"></canvas><div>امتیاز</div><div class="big" id="fs">0</div><div id="fb"></div><button class="g" id="bAgain">↻ دوباره</button><button class="d" id="bHome2">⌂ منو</button></div></div>
<script>
const $=s=>document.querySelector(s),cv=$('#c'),g=cv.getContext('2d');let W,H,D,S,mode='menu',held=false,t=0,last=0,best=0;let cfg={mus:1,sfx:1,vib:0};try{best=+localStorage.getItem('bg_best')||0}catch(e){}const save=()=>{try{localStorage.setItem('bg_best',best);localStorage.setItem('bg_cfg',JSON.stringify(cfg))}catch(e){}};function rs(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;S=Math.max(34,Math.min(W,H*.62)*.13)}addEventListener('resize',rs);rs();
function rr(c,x,y,w,h,r){c.beginPath();c.roundRect(x,y,w,h,r)}function balloon(c,x,y,s,rot,fl){c.save();c.translate(x,y);c.rotate(rot);let u=s/100;c.scale(u,u);c.lineJoin='round';c.strokeStyle='#0c0810';c.lineWidth=7;if(fl){c.fillStyle='#ff7a2f';c.beginPath();c.moveTo(-14,88);c.quadraticCurveTo(-10,114,2,128);c.quadraticCurveTo(16,110,14,88);c.fill();c.fillStyle='#ffd25a';c.beginPath();c.moveTo(-7,88);c.quadraticCurveTo(-4,104,2,112);c.quadraticCurveTo(9,102,7,88);c.fill()}c.strokeStyle='#3a2226';c.lineWidth=5;c.beginPath();c.moveTo(-26,-2);c.lineTo(-34,40);c.moveTo(26,-2);c.lineTo(34,40);c.stroke();let gr=c.createLinearGradient(-45,0,45,0);gr.addColorStop(0,'#5a3a40');gr.addColorStop(.55,'#7a5158');gr.addColorStop(1,'#4a2f35');c.fillStyle=gr;c.strokeStyle='#0c0810';c.lineWidth=7;rr(c,-48,38,96,50,10);c.fill();c.stroke();c.strokeStyle='#0005';c.lineWidth=3;for(let i=-24;i<=24;i+=24){c.beginPath();c.moveTo(i,42);c.lineTo(i,86);c.stroke()}gr=c.createLinearGradient(-50,0,50,0);gr.addColorStop(0,'#cbbf97');gr.addColorStop(.35,'#eee3bb');gr.addColorStop(1,'#d9cea6');c.fillStyle=gr;c.strokeStyle='#0c0810';c.lineWidth=7;c.beginPath();c.moveTo(-48,0);c.lineTo(-48,-70);c.quadraticCurveTo(-48,-115,-4,-115);c.quadraticCurveTo(48,-115,48,-70);c.lineTo(48,0);c.quadraticCurveTo(0,10,-48,0);c.closePath();c.fill();c.stroke();c.fillStyle='#0c0810';c.beginPath();c.ellipse(28,-58,9,10,0,0,7);c.fill();c.fillStyle='#fff';c.beginPath();c.arc(30,-60,2.6,0,7);c.fill();c.restore()}
function mini(id,dead=false){let c=$(id).getContext('2d');c.clearRect(0,0,$(id).width,$(id).height);balloon(c,$(id).width/2,$(id).height/2,$(id).width*.42,dead?.5:0,!dead)}setInterval(()=>{if(mode==='menu')mini('#m1')},80);
let P=[],off=0,score=0;const gapH=()=>S*Math.max(1.95,2.9-score*.035),pw=()=>S*.95,spd=()=>W*Math.min(1.35,.72+score*.035);function spawn(x){P.push({x,b:H*.45+(Math.random()-.5)*H*.55,p:0})}function reset(){P=[];off=0;score=0;for(let i=0;i<4;i++)spawn(W*.95+i*W*.55);$('#sc').textContent=0}reset();const bx=()=>W*.26,by=()=>H*.46;function gy(p){let h=gapH()/2,m=S*.3;return Math.max(h+m,Math.min(H-h-m,p.b+off))}function kill(){if(mode!=='play')return;mode='over';if(score>best){best=score;save()}$('#fs').textContent=score;$('#fb').textContent='بهترین: '+best;mini('#m2',true)}function step(dt){off+=(held?-1:1)*H*.95*dt;off=Math.max(-H*.75,Math.min(H*.75,off));for(let p of P)p.x-=spd()*dt;if(P[0].x+pw()<bx()-S)P.shift();while(P.length<4)spawn(P[P.length-1].x+W*.55);let hw=S*.42,hh=S*.72,y=by();for(let p of P){if(!p.p&&p.x+pw()<bx()-hw){p.p=1;score++;$('#sc').textContent=score}if(bx()+hw>p.x&&bx()-hw<p.x+pw()){let q=gy(p),h=gapH()/2;if(y-hh<q-h||y+hh>q+h)kill()}}}
let bg;function bgm(){bg=document.createElement('canvas');bg.width=W*D;bg.height=H*D;let c=bg.getContext('2d');c.scale(D,D);let gr=c.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#2c1657');gr.addColorStop(.35,'#6b2a5c');gr.addColorStop(.62,'#d4542c');gr.addColorStop(.85,'#ff9a2e');gr.addColorStop(1,'#a0381f');c.fillStyle=gr;c.fillRect(0,0,W,H);let sy=H*.8,r=Math.min(W,H)*.42;c.fillStyle='#ff8a21';c.beginPath();c.arc(W/2,sy,r,0,7);c.fill()}function pillar(c,x,a,b){let w=pw();if(b<=a)return;c.fillStyle='#5a3c2a';c.fillRect(x,a,w,b-a);c.strokeStyle='#0b0706';c.lineWidth=3;c.strokeRect(x,a,w,b-a)}function draw(){if(!bg||bg.width!==W*D)bgm();g.setTransform(D,0,0,D,0,0);g.drawImage(bg,0,0,W,H);if(mode!=='menu'&&mode!=='set'&&mode!=='guide'){for(let p of P){let q=gy(p),h=gapH()/2;pillar(g,p.x,-20,q-h);pillar(g,p.x,q+h,H+20)}balloon(g,bx(),by(),S*.78,held?-.08:.05,true)}}function loop(ts){let dt=Math.min((ts-last)/1000||0,.05);last=ts;t+=dt;if(mode==='play')step(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
function show(id){document.querySelectorAll('.scr').forEach(x=>x.classList.remove('on'));if(id)$('#'+id).classList.add('on');$('#hud').classList.toggle('on',!id||id==='none')}function start(){reset();mode='play';show('none')}function home(){mode='menu';reset();show('menu')}$('#bPlay').onclick=start;$('#bAgain').onclick=start;$('#bRe').onclick=start;$('#bHome1').onclick=home;$('#bHome2').onclick=home;$('#bSet').onclick=()=>{mode='set';show('set')};$('#bGuide').onclick=()=>{mode='guide';show('guide')};document.querySelectorAll('[data-back]').forEach(x=>x.onclick=home);$('#pz').onclick=()=>{if(mode==='play'){mode='pause';held=false;show('pause');$('#hud').classList.add('on')}};$('#bRes').onclick=()=>{mode='play';show('none')};cv.addEventListener('pointerdown',e=>{if(mode==='play'){held=true;e.preventDefault()}});addEventListener('pointerup',()=>held=false);addEventListener('pointercancel',()=>held=false);addEventListener('wheel',e=>{if(mode==='play')off+=(e.deltaY<0?-1:1)*H*.12},{passive:true});setInterval(()=>{if(mode==='menu')mini('#m1')},100);</script></body></html>
