name: Build Android APK v8

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install SVG tools
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
      - run: npm install
      - run: npm install --save-dev typescript
      - run: npm run build
      - name: Use JSON Capacitor config
        run: |
          rm -f capacitor.config.ts
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "ir.baloon.sunset",
            "appName": "بالن غروب",
            "webDir": "dist"
          }
          EOF
      - name: Prepare launcher icon
        run: |
          mkdir -p resources
          rsvg-convert -w 1024 -h 1024 design/app-icon/icon.svg -o resources/icon.png
      - run: npx cap add android
      - run: npx cap sync android
      - name: Apply balloon launcher icon
        run: |
          for f in android/app/src/main/res/mipmap-*/ic_launcher.png android/app/src/main/res/mipmap-*/ic_launcher_round.png; do
            if [ -f "$f" ]; then rsvg-convert -w 512 -h 512 design/app-icon/icon.svg -o "$f"; fi
          done
      - run: chmod +x android/gradlew
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - run: mkdir -p release && cp android/app/build/outputs/apk/debug/app-debug.apk release/baloon-sunset.apk
      - uses: actions/upload-artifact@v4
        with:
          name: baloon-sunset-apk
          path: release/baloon-sunset.apk
          retention-days: 30
