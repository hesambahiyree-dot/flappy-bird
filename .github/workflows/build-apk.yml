name: Build Balloon Sunset APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install
      - run: npm run build
      - run: npx cap add android
      - run: npx cap sync android
      - name: Generate icon
        run: |
          mkdir -p resources
          cp design/app-icon/icon_1024_transparent.png resources/icon.png
          npm install --no-save @capacitor/assets
          npx capacitor-assets generate --android
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/baloon-sunset.apk
      - uses: actions/upload-artifact@v4
        with:
          name: baloon-sunset-apk
          path: release/baloon-sunset.apk
          retention-days: 30