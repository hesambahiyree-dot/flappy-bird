name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          export BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$BUILD_TOOLS:$PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$BUILD_TOOLS" >> "$GITHUB_PATH"

          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install             "platform-tools"             "platforms;android-35"             "build-tools;35.0.0"

          echo "sdkmanager: $(command -v sdkmanager)"
          echo "apksigner: $(command -v apksigner)"
          echo "zipalign: $(command -v zipalign)"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Release APK
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Sign Release APK
        shell: bash
        run: |
          set -euo pipefail

          APK_UNSIGNED="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK_UNSIGNED" ]; then
            echo "No release APK was produced."
            find app/build/outputs -type f -maxdepth 6 -print || true
            exit 1
          fi

          echo "APK found: $APK_UNSIGNED"
          test -x "$(command -v apksigner)"

          keytool -genkeypair             -keystore flappy-release.keystore             -storepass changeit             -keypass changeit             -alias flappy             -keyalg RSA             -keysize 2048             -validity 10000             -dname "CN=Flappy Bird,O=Hesam,C=XX"

          apksigner sign             --ks flappy-release.keystore             --ks-pass pass:changeit             --key-pass pass:changeit             --out flappy-bird.apk             "$APK_UNSIGNED"

          apksigner verify --verbose flappy-bird.apk
          rm -f flappy-release.keystore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flappy-bird-apk
          path: flappy-bird.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        run: |
          {
            echo "## Flappy Bird APK"
            echo ""
            echo "Release APK built, signed and verified successfully."
            echo "Artifact: flappy-bird-apk"
          } >> "$GITHUB_STEP_SUMMARY"
