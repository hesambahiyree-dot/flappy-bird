<!doctype html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>بالن غروب</title><link rel="stylesheet" href="style.css"></head><body><main id="app"><canvas id="game" aria-label="بازی بالن غروب"></canvas>
<section id="menu" class="panel"><div class="brand"><h1>بالن غروب</h1></div><button id="play">بازی</button><button id="settings">تنظیمات</button><button id="help">راهنما</button></section>
<section id="settingsPanel" class="panel hidden"><h2>تنظیمات</h2><label>حساسیت لمس<input id="sensitivity" type="range" min=".5" max="2" step=".1" value="1"></label><label>صدا<input id="sound" type="checkbox" checked></label><button id="backSettings">بازگشت</button></section>
<section id="helpPanel" class="panel hidden"><h2>راهنما</h2><p>هر ستون را مستقیم لمس کن.</p><p>با لمس، شکاف همان ستون همیشه از موقعیت فعلی به سمت بالا حرکت می‌کند. وقتی به سقف رسید، خودش نرم به سمت پایین برمی‌گردد و در پایین متوقف می‌شود.</p><p>با کشیدن انگشت روی همان ستون، فقط همان ستون جابه‌جا می‌شود.</p><button id="backHelp">بازگشت</button></section>
<section id="gameOver" class="panel hidden"><h2>بازی تمام شد</h2><div id="finalScore"></div><button id="restart">دوباره</button><button id="home">منو</button></section>
</main><script src="script.js"></script></body></html>
